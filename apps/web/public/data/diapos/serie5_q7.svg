  <svg x="321" y="12" width="50" height="50"><rect x="14" y="2" width="22" height="46" rx="4" fill="#333"/><circle cx="25" cy="12" r="7" fill="#E53E3E"/><circle cx="25" cy="25" r="7" fill="#F6C90E"/><circle cx="25" cy="38" r="7" fill="#22C55E"/></svg>
  <!-- Header text -->
  <text x="60" y="36" font-size="12" fill="white" font-family="Arial" opacity="0.9">PERMIS DE CONDUIRE — SÉNÉGAL</text>
  <!-- Question zone -->
  <rect x="8" y="62" width="384" height="82" rx="10" fill="white" stroke="#1565C0" stroke-width="1.5"/>
  <text x="220" y="108" text-anchor="middle" font-size="12.5" font-weight="600" fill="#1A202C" font-family="Arial">Les feux de croisement (codes) sont obligatoires la</text><text x="220" y="122" text-anchor="middle" font-size="12.5" font-weight="600" fill="#1A202C" font-family="Arial">nuit et en cas de mauvaise visibilité.</text>
  <!-- Options -->
  <rect x="14" y="155" width="372" height="36" rx="8" fill="white" stroke="#1565C0" stroke-width="1.5"/>
<rect x="14" y="155" width="36" height="36" rx="8" fill="#1565C0"/>
<text x="32" y="178" text-anchor="middle" font-size="14" font-weight="900" fill="white" font-family="Arial">A</text>
<text x="78" y="169" font-size="11" fill="#1A202C" font-family="Arial">OUI, c&#x27;est exact et obligatoire</text><rect x="14" y="197" width="372" height="36" rx="8" fill="white" stroke="#1565C0" stroke-width="1.5"/>
<rect x="14" y="197" width="36" height="36" rx="8" fill="#1565C0"/>
<text x="32" y="220" text-anchor="middle" font-size="14" font-weight="900" fill="white" font-family="Arial">B</text>
<text x="78" y="211" font-size="11" fill="#1A202C" font-family="Arial">NON, ce n&#x27;est pas correct</text><rect x="14" y="239" width="372" height="36" rx="8" fill="white" stroke="#1565C0" stroke-width="1.5"/>
<rect x="14" y="239" width="36" height="36" rx="8" fill="#1565C0"/>
<text x="32" y="262" text-anchor="middle" font-size="14" font-weight="900" fill="white" font-family="Arial">C</text>
<text x="78" y="253" font-size="11" fill="#1A202C" font-family="Arial">OUI, dans certaines conditions seulement</text><rect x="14" y="281" width="372" height="36" rx="8" fill="white" stroke="#1565C0" stroke-width="1.5"/>
<rect x="14" y="281" width="36" height="36" rx="8" fill="#1565C0"/>
<text x="32" y="304" text-anchor="middle" font-size="14" font-weight="900" fill="white" font-family="Arial">D</text>
<text x="78" y="295" font-size="11" fill="#1A202C" font-family="Arial">NON, sauf exception réglementaire</text>

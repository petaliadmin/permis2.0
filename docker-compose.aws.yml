version: '3.8'

# Deployed only on the EC2 host, via SSM (see scripts/aws/deploy-remote.sh).
# Unlike docker-compose.prod.yml, this pulls pre-built images from Docker Hub
# instead of building from source — the instance never needs the repo checked out.

services:
  postgres:
    image: postgres:16-alpine
    container_name: permis2.0-db-prod
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    volumes:
      - postgres_data_prod:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"

  api:
    image: ${IMAGE_NAMESPACE}/permis2.0-api:${IMAGE_TAG:-latest}
    container_name: permis2.0-api-prod
    environment:
      NODE_ENV: production
      PORT: 3001
      DATABASE_URL: postgresql://${DB_USER}:${DB_PASSWORD}@postgres:5432/${DB_NAME}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRATION: ${JWT_EXPIRATION:-24h}
      FRONTEND_URL: ${FRONTEND_URL}
      WEB_URL: ${WEB_URL:-${FRONTEND_URL}}
      TERMII_API_KEY: ${TERMII_API_KEY}
      TERMII_SENDER_ID: ${TERMII_SENDER_ID:-PERMIS}
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      VAPID_EMAIL: ${VAPID_EMAIL:-mailto:admin@permis2.com}
      PAYMENT_LIVE: ${PAYMENT_LIVE:-false}
      BICTORYS_API_URL: ${BICTORYS_API_URL:-https://api.bictorys.com}
      BICTORYS_API_KEY: ${BICTORYS_API_KEY}
      BICTORYS_SECRET_KEY: ${BICTORYS_SECRET_KEY}
      PAYMENT_COUNTRY: ${PAYMENT_COUNTRY:-SN}
    ports:
      - "3001:3001"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3001/health', (r) => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"

  web:
    image: ${IMAGE_NAMESPACE}/permis2.0-web:${IMAGE_TAG:-latest}
    container_name: permis2.0-web-prod
    environment:
      NODE_ENV: production
      # NEXT_PUBLIC_* are already baked into this image at build time (see
      # Dockerfile.web); this is just for the Node server process itself.
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
    ports:
      - "3000:3000"
    depends_on:
      - api
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000', (r) => process.exit(r.statusCode < 400 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"

volumes:
  postgres_data_prod:
    driver: local

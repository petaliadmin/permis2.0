version: '3.8'

# Deployed only on the EC2 host, via SSM (see scripts/aws/deploy-remote.sh).
# Unlike docker-compose.prod.yml, this pulls pre-built images from Docker Hub
# instead of building from source — the instance never needs the repo checked out.

services:
  postgres:
    image: postgres:16-alpine
    container_name: permis2-0-db-prod
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    # Conservative tuning for the current t3.small (2GB RAM) host shared with
    # api/web/caddy — infra/aws/variables.tf instance_type is pinned back to
    # t3.small because the AWS account is still on the restricted "Free Plan"
    # (billing upgrade needed before t3.medium/etc. are allowed; see chat).
    # Once resized to t3.medium, bump shared_buffers→256MB and
    # effective_cache_size→1GB to actually use the extra RAM.
    command:
      - "postgres"
      - "-c"
      - "shared_buffers=128MB"
      - "-c"
      - "effective_cache_size=512MB"
      - "-c"
      - "work_mem=4MB"
      - "-c"
      - "max_connections=100"
    shm_size: "128mb"
    volumes:
      - postgres_data_prod:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"

  api:
    image: ${IMAGE_NAMESPACE}/permis2-0-api:${IMAGE_TAG:-latest}
    container_name: permis2-0-api-prod
    environment:
      NODE_ENV: production
      PORT: 3001
      # connection_limit: Prisma's default (num_cpus*2+1 ≈ 5 on this host) is
      # too small for concurrent users — requests would queue waiting for a
      # pooled connection even though Postgres (max_connections=100 above)
      # has headroom. Kept modest (10) while still on t3.small's 2GB RAM;
      # raise toward 20+ once resized to t3.medium.
      DATABASE_URL: postgresql://${DB_USER}:${DB_PASSWORD}@postgres:5432/${DB_NAME}?connection_limit=10&pool_timeout=20
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRATION: ${JWT_EXPIRATION:-24h}
      FRONTEND_URL: ${FRONTEND_URL}
      WEB_URL: ${WEB_URL:-${FRONTEND_URL}}
      BREVO_API_KEY: ${BREVO_API_KEY}
      BREVO_SMS_SENDER: ${BREVO_SMS_SENDER:-PERMIS}
      BREVO_WHATSAPP_TEMPLATE_ID: ${BREVO_WHATSAPP_TEMPLATE_ID:-}
      BREVO_WHATSAPP_SENDER_NUMBER: ${BREVO_WHATSAPP_SENDER_NUMBER:-}
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      VAPID_EMAIL: ${VAPID_EMAIL:-mailto:admin@permis2.com}
      PAYMENT_LIVE: ${PAYMENT_LIVE:-false}
      BICTORYS_API_URL: ${BICTORYS_API_URL:-https://api.bictorys.com}
      BICTORYS_API_KEY: ${BICTORYS_API_KEY}
      BICTORYS_SECRET_KEY: ${BICTORYS_SECRET_KEY}
      PAYMENT_COUNTRY: ${PAYMENT_COUNTRY:-SN}
    # No published port: only Caddy talks to this, via the Docker network
    # (api:3001) — see Caddyfile.
    expose:
      - "3001"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3001/health', (r) => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"

  web:
    image: ${IMAGE_NAMESPACE}/permis2-0-web:${IMAGE_TAG:-latest}
    container_name: permis2-0-web-prod
    environment:
      NODE_ENV: production
      # NEXT_PUBLIC_* are already baked into this image at build time (see
      # Dockerfile.web); this is just for the Node server process itself.
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
    # No published port: only Caddy talks to this, via the Docker network
    # (web:3000) — see Caddyfile.
    expose:
      - "3000"
    depends_on:
      - api
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000', (r) => process.exit(r.statusCode < 400 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"

  # HTTPS reverse proxy (www.permis2.com / permis2.com / api.permis2.com) —
  # obtains and renews Let's Encrypt certs automatically. The only entry
  # point into web/api; both are otherwise unreachable from outside the
  # Docker network (see their `expose` lines above).
  caddy:
    image: caddy:2-alpine
    container_name: permis2-0-caddy-prod
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api
      - web
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"

volumes:
  postgres_data_prod:
    driver: local
  caddy_data:
    driver: local
  caddy_config:
    driver: local

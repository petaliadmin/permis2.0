name: Deploy to AWS

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  id-token: write # required for AWS OIDC
  contents: read

concurrency:
  group: deploy-prod
  cancel-in-progress: false

env:
  AWS_REGION: ${{ vars.AWS_REGION }}
  PROJECT_NAME: ${{ vars.PROJECT_NAME }}
  IMAGE_NAMESPACE: ${{ secrets.DOCKERHUB_USERNAME }}

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build & push API image
        env:
          TAG: ${{ github.sha }}
        run: |
          docker build -f Dockerfile.api \
            -t "$IMAGE_NAMESPACE/$PROJECT_NAME-api:$TAG" \
            -t "$IMAGE_NAMESPACE/$PROJECT_NAME-api:latest" \
            .
          docker push "$IMAGE_NAMESPACE/$PROJECT_NAME-api:$TAG"
          docker push "$IMAGE_NAMESPACE/$PROJECT_NAME-api:latest"

      - name: Build & push Web image
        env:
          TAG: ${{ github.sha }}
        run: |
          docker build -f Dockerfile.web \
            --build-arg NEXT_PUBLIC_API_URL="${{ vars.PUBLIC_APP_URL }}:3001" \
            --build-arg NEXT_PUBLIC_PAYMENT_MODE="manual" \
            --build-arg NEXT_PUBLIC_PAYMENT_LIVE="false" \
            -t "$IMAGE_NAMESPACE/$PROJECT_NAME-web:$TAG" \
            -t "$IMAGE_NAMESPACE/$PROJECT_NAME-web:latest" \
            .
          docker push "$IMAGE_NAMESPACE/$PROJECT_NAME-web:$TAG"
          docker push "$IMAGE_NAMESPACE/$PROJECT_NAME-web:latest"

      - name: Configure AWS credentials (OIDC — no stored keys)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Upload deploy artifacts to S3
        run: |
          aws s3 cp docker-compose.aws.yml "s3://${{ vars.AWS_BACKUPS_BUCKET }}/deploy/docker-compose.aws.yml"
          aws s3 cp scripts/aws/deploy-remote.sh "s3://${{ vars.AWS_BACKUPS_BUCKET }}/deploy/deploy-remote.sh"

      - name: Deploy via SSM
        env:
          TAG: ${{ github.sha }}
          BACKUPS_BUCKET: ${{ vars.AWS_BACKUPS_BUCKET }}
          SSM_PREFIX: ${{ vars.AWS_SSM_PREFIX }}
        run: |
          # Built as one shell command (not a multi-element array) and JSON-encoded
          # with jq — sidesteps fragile quoting of the AWS CLI's shorthand array
          # syntax for --parameters across a multi-line string.
          CMD="export IMAGE_NAMESPACE=$IMAGE_NAMESPACE IMAGE_TAG=$TAG AWS_REGION=$AWS_REGION BACKUPS_BUCKET=$BACKUPS_BUCKET PROJECT_NAME=$PROJECT_NAME SSM_PREFIX=$SSM_PREFIX && aws s3 cp s3://$BACKUPS_BUCKET/deploy/deploy-remote.sh - | bash"
          CMD_JSON=$(printf '%s' "$CMD" | jq -Rs .)

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "${{ vars.AWS_INSTANCE_ID }}" \
            --document-name "AWS-RunShellScript" \
            --comment "Deploy $PROJECT_NAME $TAG" \
            --parameters "{\"commands\":[$CMD_JSON]}" \
            --query "Command.CommandId" --output text)

          echo "SSM command: $COMMAND_ID"

          for i in $(seq 1 60); do
            sleep 5
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "${{ vars.AWS_INSTANCE_ID }}" \
              --query "Status" --output text 2>/dev/null || echo "Pending")
            echo "  status: $STATUS"
            case "$STATUS" in
              Success) break ;;
              Failed|Cancelled|TimedOut)
                aws ssm get-command-invocation \
                  --command-id "$COMMAND_ID" \
                  --instance-id "${{ vars.AWS_INSTANCE_ID }}" \
                  --query "StandardOutputContent" --output text
                aws ssm get-command-invocation \
                  --command-id "$COMMAND_ID" \
                  --instance-id "${{ vars.AWS_INSTANCE_ID }}" \
                  --query "StandardErrorContent" --output text
                exit 1
                ;;
            esac
          done

          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "${{ vars.AWS_INSTANCE_ID }}" \
            --query "StandardOutputContent" --output text
